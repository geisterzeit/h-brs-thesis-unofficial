name: Bug report
description: Something in the template renders wrong or fails to compile.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: The smallest document that shows the problem.
      render: typst
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "0.1.2"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where do you compile?
      options:
        - Typst web app
        - Typst CLI
        - Tinymist / editor integration
    validations:
      required: true
